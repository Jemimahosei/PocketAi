services:
  - type: web
    name: pocketai
    env: docker
    plan: free
    envVars:
      # No Ollama exists on a server, so the deployed default is
      # Claude. There is no per-request fallback: a Llama pick that
      # cannot serve fails honestly rather than silently using Claude.
      - key: POCKETAI_BACKEND
        value: claude
      # The hosted site must never read the server's own files.
      # (app.py also forces this off whenever RENDER is set.)
      - key: POCKETAI_FILE_TOOLS
        value: off
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      # Set in the Render dashboard at creation — never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
